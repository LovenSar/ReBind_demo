# Ghidra Headless 分析工具配置
ghidra:
  # Ghidra analyzeHeadless.bat 的完整路径
  cmd_path: "/Users/lovensar/Applications/ghidra_11.4.3_PUBLIC_20251203/ghidra_11.4.3_PUBLIC/support/analyzeHeadless"
  
  # 临时项目名称前缀
  project_name_prefix: "MyPEAnalysisTemp"
  
  # 工作空间目录（留空则使用输入文件所在目录）
  workspace: ""

# 输出配置
output:
  # 输出目录命名后缀
  dir_suffix: "_ghidemo"
  
  # 是否保留临时Python脚本
  keep_python_scripts: false
  
  # 是否保留原始输入文件副本
  keep_input_copy: false

# 脚本配置
scripts:
  # 要执行的Ghidra Python脚本列表
  post_scripts:
    - "ExtractBinaryInfo.py"
    - "ExtractDisassembly.py"
    - "ExtractPseudocode.py"
  
  # 脚本搜索路径（留空则使用工作目录）
  script_path: ""

# 文件名处理
filename:
  # 是否进行文件名清理（移除非法字符）
  sanitize: true
  
  # 允许的文件名字符（正则表达式）
  allowed_chars_pattern: "[A-Za-z0-9]"
  
  # 替换非法字符的字符
  replacement_char: "_"

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # 是否输出到文件
  log_to_file: true
  
  # 日志文件路径（留空则使用输出目录）
  log_file_path: ""