# IDA Headless 分析工具配置
ida:
  # IDA idat.exe 的完整路径
  cmd_path: "/Applications/IDA\ Professional\ 9.2.app/Contents/MacOS/idat"
  
  # IDA 命令行参数
  args: "-A -c"

# 输出配置
output:
  # 输出目录命名后缀
  dir_suffix: "_idademo"
  
  # 是否保留临时Python脚本
  keep_python_scripts: false
  
  # 是否保留原始输入文件副本
  keep_input_copy: false

# 脚本配置
scripts:
  # 要执行的IDA Python脚本列表（按顺序执行）
  scripts:
    - "ExtractBinaryInfo_IDA.py"
    - "ExtractDisassembly_IDA.py"
    - "ExtractPseudocode_IDA.py"

# 文件名处理
filename:
  # 是否进行文件名清理（移除非法字符）
  sanitize: true
  
  # 允许的文件名字符（正则表达式）
  allowed_chars_pattern: "[A-Za-z0-9]"
  
  # 替换非法字符的字符
  replacement_char: "_"

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # 是否输出到文件
  log_to_file: true
  
  # 日志文件路径（留空则使用输出目录）
  log_file_path: ""