# =============================================================================
# ReBind Demo — 唯一配置文件（仓库根目录）
# =============================================================================
# 所有 Ghidra / IDA / 语义流水线参数均在此维护，可按 platforms.<os> 覆盖路径等。
# 不再使用 tools/*/config.yaml。
#
# 结构说明：
# - platforms.windows | macos | linux：按系统覆盖 ghidra / ida / semantics 子树
# - ghidra：Ghidra Headless + ExtractAll.py（与 ghidra_adapter 期望结构一致）
# - ida：IDA + ExtractAll_IDA.py
# - semantics：breadth 流水线 / depth 引擎 等（llm / pipeline / runtime）
# =============================================================================

platforms:
  windows:
    ghidra:
      ghidra:
        cmd_path: "E:\\Program Files (x86)\\ghidra_11.4.3_PUBLIC_20251203\\ghidra_11.4.3_PUBLIC\\support\\analyzeHeadless.bat"
    ida:
      ida:
        cmd_path: "C:\\Program Files\\IDA Professional 9.2\\idat.exe"
        args: ["-A", "-c"]
    semantics:
      runtime:
        idat_exe: "C:\\Program Files\\IDA Professional 9.2\\idat.exe"

  macos:
    ghidra:
      ghidra:
        cmd_path: "/Users/lovensar/Applications/ghidra_12.0.4_PUBLIC_20260303/ghidra_12.0.4_PUBLIC/support/analyzeHeadless"
    ida:
      ida:
        cmd_path: "/Applications/IDA Professional 9.2.app/Contents/MacOS/idat"
        args: ["-A", "-c"]
    semantics:
      runtime:
        idat_exe: "/Applications/IDA Professional 9.2.app/Contents/MacOS/idat"

  linux:
    ghidra:
      ghidra:
        cmd_path: "/opt/ghidra/support/analyzeHeadless"
    ida:
      ida:
        cmd_path: "/opt/ida/idat64"
        args: ["-A", "-c"]
    semantics:
      runtime:
        idat_exe: "/opt/ida/idat64"

# -----------------------------------------------------------------------------
# Ghidra Headless（ExtractAll.py）
# -----------------------------------------------------------------------------
ghidra:
  ghidra:
    workspace: ""
    project_name_prefix: "ReBindDemo"
    extra_headless_args: []
  output:
    dir_suffix: "_ghidemo"
    keep_python_scripts: false
    keep_input_copy: false
  scripts:
    use_temp_project: true
    temp_project_name: "proj"
    copy_tool_scripts: false
    script_path: ""
    post_script: "ExtractAll.py"
    post_script_args:
      - "{output_dir}"
      - "{input_filename}"
    post_script_extra: []
    legacy_cwd_output_move: false
    post_scripts: []
  filename:
    sanitize: true
    allowed_chars_pattern: "[A-Za-z0-9]"
    replacement_char: "_"
  logging:
    level: "INFO"
    log_to_file: true
    log_file_path: ""

# -----------------------------------------------------------------------------
# IDA Headless（ExtractAll_IDA.py）
# -----------------------------------------------------------------------------
ida:
  ida:
    args: ["-A", "-c"]
  output:
    dir_suffix: "_idademo"
    keep_python_scripts: false
    keep_input_copy: true
  scripts:
    scripts:
      - "ExtractAll_IDA.py"
  filename:
    sanitize: true
    allowed_chars_pattern: "[A-Za-z0-9]"
    replacement_char: "_"
  logging:
    level: "INFO"
    log_to_file: true
    log_file_path: ""

# -----------------------------------------------------------------------------
# Semantics Alignment（LLM + 流水线）
# -----------------------------------------------------------------------------
semantics:
  runtime:
    ida_url: "http://127.0.0.1:12345"
    ida_start_delay: 3.0
    no_ida: false
    no_align: false

  llm:
    provider: "openai"
    model: "LongCat-Flash-Chat"
    temperature: 0.1
    max_tokens: 6000
    api:
      key_env_var: "OPENAI_API_KEY"
      base_url: "https://api.longcat.chat/openai/v1"
    chat_completion_kwargs: {}

  # Phase7 任务参数的唯一维护位置。每样本预处理生成的 JSON 仅是运行快照，
  # 不会被隐式加载；显式 --task-config 可在单次运行中覆盖这里的默认值。
  phase7:
    task_defaults:
      binary_id: null
      goal_va: []
      goal_keyword: []
      goal_struct: []
      goal_limit: 3
      auto_goal_limit: 20

      # 规范要求第一代优先从程序入口主干开始；可用 goal 或 gen1_root_va 覆盖。
      gen1_subtree_mode: "entry"
      gen1_entry_top_k: 3
      gen1_root_va: null

      lambda_radius: 2.5
      w_call: 0.45
      w_data: 0.30
      w_string: 0.15
      w_global: 0.10

      max_depth: 0
      max_paths: 200
      max_branch: 6
      max_call_sites: 3
      cond_window: 10
      max_guards_per_site: 3

      max_generations: 0
      gen_stop_new_ratio: 0.05
      gen_token_budget: 0
      gen2_ancestor_depth: 5
      gen2_min_wlca: 0.28
      gen2_frontier_k: 3
      gen2_alpha: 0.65
      gen2_beta: 0.08
      gen2_gamma: 0.40

      indirect_edge_mode: "auto"
      indirect_edge_budget: 25000
      incremental_indirect: false
      incremental_indirect_topn: 3000

      llm_mode: "auto"
      llm_model: null
      llm_temperature: null
      llm_max_tokens: null
      llm_max_attempts: 3
      llm_code_chars: 1200
      llm_max_steps: 0

      max_compare_nodes: 12
      compare_min_delta: 0.10
      apply_db: false
      apply_max_rows: 0
      apply_min_confidence: 70
      phase7_5_ida_dir: null
      phase7_5_keep_rebuilt_db: false

      resume: false
      force_resume: false
      log_raw_llm: false
      dry_run: false
      no_console_progress: false

    presets:
      exploratory:
        goal_limit: 5
        max_generations: 2
        max_paths: 260
      balanced: {}
      conservative:
        goal_limit: 2
        max_generations: 1
        max_paths: 80
        max_branch: 5
        max_call_sites: 2
        indirect_edge_budget: 12000
        incremental_indirect: true

    preprocess:
      exploratory_function_limit: 800
      balanced_function_limit: 8000
      large_function_limit: 8000
      large_xref_limit: 300000
      very_large_function_limit: 15000
      very_large_xref_limit: 800000
      large_overrides:
        max_paths: 80
        max_branch: 4
        indirect_edge_budget: 10000
        incremental_indirect: true
      very_large_overrides:
        max_paths: 50
        max_branch: 4
        indirect_edge_budget: 6000
        incremental_indirect: true

  pipeline:
    ida_sync:
      connect_max_wait_seconds: 120

    phase1:
      batch_size_default: 25
      target_preview_max: 20
      scheduler_top_k: 50
      score_recompute_every_batches: 8

    phase4_lvar:
      min_pseudo_lines_default: 6
      batch_size_cap: 3
      verify_max_retries: 3
      verify_wait_seconds: 1.0

    prompt_limits:
      phase1_max_disasm_lines: 200
      phase1_max_pseudo_chars_per_tool: 4000
      phase1_max_strings: 20
      annotation_context_max_disasm_lines: 60
      annotation_context_max_pseudo_chars_per_tool: 1200
      annotation_context_max_strings: 20
      ida_snapshot_max_disasm_lines: 400
      annotation_ida_disasm_lines_per_prompt: 120

    phase5_annotation:
      min_pseudo_lines: 6
      max_code_chars: 8000
      max_comments_per_prompt: 60
      max_comments_ratio: 0.35
      max_duplicate_comment_occurrences: 2
      llm_chunking:
        single_max_lines: 80
        medium_max_lines: 160
        medium_chunk_size: 120
        large_chunk_size: 80
      ida_sync_chunk_size: 120
      log_llm_response: true
      log_llm_response_max_chars: 0

    sqlite_tuning:
      enabled: true
      wal: true
      synchronous_normal: true
      temp_store_memory: true
      busy_timeout_ms: 5000
      cache_size_kib: 131072
